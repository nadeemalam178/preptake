name: PrepTake Production CI & Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Question Bank & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Question Bank Integrity
        run: |
          python content-pipeline/validation/validate_questions.py

      - name: Audit Test Catalog Integrity
        run: |
          python content-pipeline/validation/audit_tests.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Backend Auth & Schema Verification
        env:
          NEXT_PUBLIC_GOOGLE_SHEET_ID: '14bH4IMp7x5nR3TJEKzt5VtIAq-WivnEPhSFCIfZwfb0'
          NEXT_PUBLIC_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwaRRVTypYkRt6OKKqwXWqBUUIi1QIYgw0esp3Cp4YUit4aDA-MIYm-pOAVqy7q8m1e/exec'
        run: |
          node tests/backend_auth_test.mjs

      - name: Test Next.js Production Build
        env:
          NEXT_PUBLIC_GOOGLE_SHEET_ID: '14bH4IMp7x5nR3TJEKzt5VtIAq-WivnEPhSFCIfZwfb0'
          NEXT_PUBLIC_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwaRRVTypYkRt6OKKqwXWqBUUIi1QIYgw0esp3Cp4YUit4aDA-MIYm-pOAVqy7q8m1e/exec'
        run: npm run build
