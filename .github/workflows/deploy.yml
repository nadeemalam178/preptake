name: Deploy PrepTake to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Question Bank Integrity
        run: |
          python content-pipeline/validation/validate_questions.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Backend Auth & Schema Verification
        env:
          NEXT_PUBLIC_GOOGLE_SHEET_ID: '14bH4IMp7x5nR3TJEKzt5VtIAq-WivnEPhSFCIfZwfb0'
          NEXT_PUBLIC_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwaRRVTypYkRt6OKKqwXWqBUUIi1QIYgw0esp3Cp4YUit4aDA-MIYm-pOAVqy7q8m1e/exec'
        run: |
          node tests/backend_auth_test.mjs

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Build Static Next.js Application
        env:
          NEXT_PUBLIC_BASE_PATH: '/preptake'
          NEXT_PUBLIC_GOOGLE_SHEET_ID: '14bH4IMp7x5nR3TJEKzt5VtIAq-WivnEPhSFCIfZwfb0'
          NEXT_PUBLIC_APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwaRRVTypYkRt6OKKqwXWqBUUIi1QIYgw0esp3Cp4YUit4aDA-MIYm-pOAVqy7q8m1e/exec'
        run: npm run build

      - name: Upload Static Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
